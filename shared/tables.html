<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตารางปัจจัยมูลค่าของเงินตามเวลา | การเงินธุรกิจ I (Business Finance I)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html{font-size:16px}
body{overflow:auto!important;height:auto!important;background:#fff;color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif}
.wrap{max-width:84rem;margin:0 auto;padding:1rem 1.2rem 3rem}
.hd{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem;margin-bottom:1rem}
.hd img{height:44px;width:auto}
.hd .mid{flex:1;text-align:center;color:var(--muted);font-size:.9rem}
h1{font-size:1.7rem;margin:.2rem 0}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 .6rem;position:sticky;top:0;background:#fff;padding:.5rem 0;z-index:5}
.tabs a{padding:.5rem 1rem;border:1.5px solid var(--green);border-radius:99px;text-decoration:none;color:var(--green-d);font-weight:600;font-size:.95rem}
.tabs a.on{background:var(--green);color:#fff}
.box{background:var(--purple-l);border-left:.35rem solid var(--purple);border-radius:0 .8rem .8rem 0;padding:.8rem 1.1rem;margin:.6rem 0}
.box b{color:var(--purple)}
table.sym{border-collapse:collapse;margin:.4rem 0;font-size:.92rem}
table.sym td{padding:.2rem .8rem;border-bottom:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin:.8rem 0;padding:.7rem 1rem;background:var(--soft);border-radius:.8rem}
.tools input{width:5.5rem;padding:.4rem .5rem;border:1.5px solid var(--line);border-radius:.5rem;font-size:1rem}
.tools .res{font-weight:700;color:var(--green-d);font-size:1.05rem}
.scroll{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:.6rem}
table.ft{border-collapse:separate;border-spacing:0;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
table.ft th,table.ft td{padding:.3rem .55rem;text-align:right;border-bottom:1px solid #EEF3F1;border-right:1px solid #F3F6F5}
table.ft thead th{position:sticky;top:0;background:var(--green);color:#fff;z-index:2}
table.ft tbody th{position:sticky;left:0;background:var(--soft);color:var(--green-d);z-index:1;text-align:center}
table.ft thead th:first-child{left:0;z-index:3}
table.ft tbody tr:nth-child(even) td{background:#FAFCFB}
table.ft td.hl{background:#FFE08A!important;font-weight:700;outline:2px solid #E0A526;outline-offset:-2px}
table.ft tr.hr th,table.ft tr.hr td{background:#FFF4DC}
table.ft td.hc{background:#FFF4DC}
.pr{margin-top:1rem}
.btn2{border:1.5px solid var(--green);background:#fff;color:var(--green-d);padding:.4rem .9rem;border-radius:.6rem;font-weight:600;cursor:pointer;font-family:inherit}
@media print{.tabs,.tools,.pr{display:none}.scroll{max-height:none;overflow:visible}table.ft{font-size:7pt}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><img src="img/aacsb.png" alt="AACSB Accredited"><div class="mid">การเงินธุรกิจ I (Business Finance I)</div><img src="img/cmubs.png" alt="Chiang Mai University Business School"></div>
  <h1>ตารางปัจจัยมูลค่าของเงินตามเวลา (Time Value of Money Factor Tables)</h1>
  <div class="tabs" id="tabs"></div>
  <div class="box" id="info"></div>
  <div class="tools">
    <span>ค้นหาค่า:</span>
    <label>n (งวด) <input id="qn" type="number" min="1" max="50" step="1" value="5"></label>
    <label>i (% ต่องวด) <input id="qr" type="number" min="0.5" max="30" step="0.5" value="10"></label>
    <span class="res" id="qres"></span>
  </div>
  <div class="scroll"><table class="ft" id="tbl"></table></div>
  <p class="small" style="color:var(--muted);margin-top:.6rem">ค่าในตารางคำนวณจากสูตรโดยตรง ปัดเป็นทศนิยม 4 ตำแหน่ง (ตารางตำราบางเล่มใช้ 3–5 ตำแหน่ง ผลลัพธ์อาจต่างกันเล็กน้อย) งวดและอัตราดอกเบี้ยต้องใช้หน่วยเดียวกัน เช่น รายปีกับอัตราต่อปี</p>
  <div class="pr"><button class="btn2" onclick="window.print()">พิมพ์ตารางนี้</button> <button class="btn2" onclick="history.length>1&&window.close();if(!window.closed)history.back()">ปิดหน้านี้</button></div>
</div>
<script>
(function () {
  var T = {
    fvif:  { name: 'FVIF', th: 'ตัวคูณมูลค่าอนาคตของเงินก้อนเดียว (Future Value Interest Factor)', f: function (i, n) { return Math.pow(1 + i, n); },
      form: 'FVIF<sub>i,n</sub> = (1 + i)<sup>n</sup>', use: 'FV = PV × FVIF<sub>i,n</sub>', sym: [['FVIF<sub>i,n</sub>', 'ตัวคูณมูลค่าอนาคต ที่อัตราดอกเบี้ย i ต่อ n งวด'], ['i', 'อัตราดอกเบี้ยต่องวด (ทศนิยม)'], ['n', 'จำนวนงวด'], ['FV', 'มูลค่าอนาคต (Future Value)'], ['PV', 'มูลค่าปัจจุบัน (Present Value)']] },
    pvif:  { name: 'PVIF', th: 'ตัวคูณมูลค่าปัจจุบันของเงินก้อนเดียว (Present Value Interest Factor)', f: function (i, n) { return 1 / Math.pow(1 + i, n); },
      form: 'PVIF<sub>i,n</sub> = 1 ÷ (1 + i)<sup>n</sup>', use: 'PV = FV × PVIF<sub>i,n</sub>', sym: [['PVIF<sub>i,n</sub>', 'ตัวคูณมูลค่าปัจจุบัน ที่อัตราคิดลด i ต่อ n งวด'], ['i', 'อัตราคิดลดต่องวด (ทศนิยม)'], ['n', 'จำนวนงวด'], ['FV', 'เงินที่จะได้รับในอนาคต'], ['PV', 'มูลค่าปัจจุบัน']] },
    fvifa: { name: 'FVIFA', th: 'ตัวคูณมูลค่าอนาคตของเงินงวด (Future Value Interest Factor of an Annuity)', f: function (i, n) { return i === 0 ? n : (Math.pow(1 + i, n) - 1) / i; },
      form: 'FVIFA<sub>i,n</sub> = [(1 + i)<sup>n</sup> − 1] ÷ i', use: 'FVA = PMT × FVIFA<sub>i,n</sub> (เงินงวดสิ้นงวด Ordinary Annuity)', sym: [['FVIFA<sub>i,n</sub>', 'ตัวคูณมูลค่าอนาคตของเงินงวด'], ['i', 'อัตราดอกเบี้ยต่องวด (ทศนิยม)'], ['n', 'จำนวนงวดที่จ่ายเงินงวด'], ['PMT', 'เงินงวดที่จ่ายเท่ากันทุกงวด (Payment)'], ['FVA', 'มูลค่าอนาคตของเงินงวด']] },
    pvifa: { name: 'PVIFA', th: 'ตัวคูณมูลค่าปัจจุบันของเงินงวด (Present Value Interest Factor of an Annuity)', f: function (i, n) { return i === 0 ? n : (1 - 1 / Math.pow(1 + i, n)) / i; },
      form: 'PVIFA<sub>i,n</sub> = [1 − 1 ÷ (1 + i)<sup>n</sup>] ÷ i', use: 'PVA = PMT × PVIFA<sub>i,n</sub> (เงินงวดสิ้นงวด Ordinary Annuity)', sym: [['PVIFA<sub>i,n</sub>', 'ตัวคูณมูลค่าปัจจุบันของเงินงวด'], ['i', 'อัตราคิดลดต่องวด (ทศนิยม)'], ['n', 'จำนวนงวด'], ['PMT', 'เงินงวดที่ได้รับหรือจ่ายเท่ากันทุกงวด'], ['PVA', 'มูลค่าปัจจุบันของเงินงวด']] }
  };
  var rates = []; for (var r = 1; r <= 20; r++) rates.push(r); rates.push(25, 30);
  var ns = []; for (var n = 1; n <= 30; n++) ns.push(n); ns.push(35, 40, 45, 50);
  var q = new URLSearchParams(location.search), cur = (location.hash.slice(1) || q.get('t') || 'pvif').toLowerCase();
  if (!T[cur]) cur = 'pvif';
  var $ = function (id) { return document.getElementById(id); };
  function lab(k) { return T[k].name; }
  function build() {
    var t = T[cur];
    document.title = 'ตาราง ' + t.name + ' | การเงินธุรกิจ I (Business Finance I)';
    $('tabs').innerHTML = Object.keys(T).map(function (k) { return '<a href="#' + k + '" class="' + (k === cur ? 'on' : '') + '">' + lab(k) + '</a>'; }).join('');
    $('info').innerHTML = '<b>' + t.name + '</b> · ' + t.th + '<br><span style="font-size:1.1rem">' + t.form + '</span><br>ใช้คำนวณ: ' + t.use +
      '<div style="margin-top:.4rem">โดยที่</div><table class="sym">' + t.sym.map(function (s) { return '<tr><td><b>' + s[0] + '</b></td><td>' + s[1] + '</td></tr>'; }).join('') + '</table>';
    var h = '<thead><tr><th>n \\ i</th>' + rates.map(function (r) { return '<th data-r="' + r + '">' + r + '%</th>'; }).join('') + '</tr></thead><tbody>';
    ns.forEach(function (n) {
      h += '<tr data-n="' + n + '"><th>' + n + '</th>' + rates.map(function (r) { return '<td data-r="' + r + '">' + t.f(r / 100, n).toFixed(4) + '</td>'; }).join('') + '</tr>';
    });
    $('tbl').innerHTML = h + '</tbody>';
    mark(true);
  }
  function mark(scroll) {
    var n = parseFloat($('qn').value), r = parseFloat($('qr').value), t = T[cur];
    Array.prototype.forEach.call(document.querySelectorAll('#tbl .hl,#tbl .hr,#tbl .hc'), function (e) { e.classList.remove('hl', 'hr', 'hc'); });
    if (!(n >= 0) || !(r >= 0)) { $('qres').textContent = ''; return; }
    var v = t.f(r / 100, n);
    $('qres').innerHTML = t.name + '<sub>' + r + '%,' + n + '</sub> = ' + v.toFixed(4);
    var td = document.querySelector('#tbl tbody tr[data-n="' + n + '"] td[data-r="' + r + '"]');
    if (td) {
      td.classList.add('hl'); td.parentNode.classList.add('hr');
      Array.prototype.forEach.call(document.querySelectorAll('#tbl td[data-r="' + r + '"]'), function (c) { if (c !== td) c.classList.add('hc'); });
      if (scroll) setTimeout(function () { td.scrollIntoView({ block: 'center', inline: 'center' }); }, 50);
    } else { $('qres').innerHTML += ' <small>(ค่า n หรือ i นี้ไม่มีในตาราง ใช้สูตรคำนวณแทน)</small>'; }
  }
  if (q.get('n')) $('qn').value = q.get('n');
  if (q.get('r')) $('qr').value = q.get('r');
  $('qn').addEventListener('input', function () { mark(true); });
  $('qr').addEventListener('input', function () { mark(true); });
  window.addEventListener('hashchange', function () { var k = location.hash.slice(1).toLowerCase(); if (T[k]) { cur = k; build(); } });
  build();
})();
</script>
</body>
</html>
